{{ $title := .Get "title" }}
{{ $desc := .Get "desc" }}
{{ $file := or (.Get "file") .Page.Params.offer_link }}
{{ $uniqueID := substr (delimit (shuffle (split "abcdefghijklmnopqrstuvwxyz" "")) "") 0 6 }}

<div style="background:#050d1a; padding:40px 24px; border:1px solid #1a3a5c; border-radius:12px; text-align:center; margin: 32px 0;">

  <div style="display:inline-block; background:#0a1a2e; border:0.5px solid #0066ff; border-radius:20px; padding:4px 16px; font-size:11px; color:#0066ff; margin-bottom:16px; font-weight:600; text-transform:uppercase; letter-spacing:1px;">
      Free Download
  </div>

  <h2 style="font-size:24px; font-weight:700; color:#ffffff; margin-bottom:10px; margin-top:0;">{{ $title }}</h2>

  {{ if $desc }}
  <p style="font-size:14px; color:#7ca4cc; margin-bottom:24px; line-height:1.6;">{{ $desc }}</p>
  {{ end }}

  <div id="start-btn-{{ $uniqueID }}" style="margin-top: 20px;">
      <button onclick="
          sessionStorage.setItem('requestedFile', '{{ $file }}');
          sessionStorage.setItem('requestedTitle', '{{ $title }}');
          document.getElementById('start-btn-{{ $uniqueID }}').style.display='none';
          document.getElementById('beehiiv-wrap-{{ $uniqueID }}').style.display='block';
      " style="padding: 12px 24px; background:#2563eb; color:#ffffff; border:none; border-radius:6px; font-size:15px; font-weight:600; cursor:pointer;">
          Get Free PDF Guide
      </button>
  </div>

  <div id="beehiiv-wrap-{{ $uniqueID }}" style="display:none; max-width:400px; margin: 0 auto;">
      <script async src="https://subscribe-forms.beehiiv.com/v3/loader.js" data-beehiiv-form="ad59540a-eb3f-413c-adb6-9c0092e409e8"></script>
  </div>

</div>
